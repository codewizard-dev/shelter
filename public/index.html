<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Бункер 18+</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Onest:wght@500;600;700&family=Rubik+Dirt&display=swap">
<style>
/* Layout: в духе shelter42 — почти чёрный фон, тёмные карточки с градиентом, оранжевые кнопки, крупные заголовки по центру. Один тёмный образ. */
:root{
  --bg:#101010; --card1:#1f1f1f; --card2:#171717; --line:#2c2c2c; --line2:#3a3a3a;
  --fg:#ffffff; --mute:#9a9a9a; --dim:#5f5f5f; --acc:#ff3500; --acc2:#ff5a2a;
  --c-prof:#4d9bff; --c-bio:#3ecf6e; --c-health:#ff4d4d; --c-hobby:#ffb020; --c-bag:#b07cff;
  --c-fact:#22c3d6; --c-trait:#ff7ac4; --c-secret:#ff3500; --c-spec:#e6e6e6;
  --f-disp:"Onest","Inter",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-logo:"Rubik Dirt","Onest",Impact,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh}
button,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-disp);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
.top{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:16px 0}
.top>.row{justify-content:flex-end}
.brand{font-family:var(--f-logo);font-size:28px;letter-spacing:.02em;text-align:center;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:linear-gradient(90deg,var(--card1),var(--card2));border-radius:99px;padding:6px 14px;font-size:13px;font-weight:500;justify-self:start}
.pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pills .pill{border-radius:6px;padding:6px 10px}
.hz{display:none}
.mono{font-variant-numeric:tabular-nums}
.lab{font:500 12px/1.2 var(--f-body);color:var(--mute)}
.panel,.mode,.stat,.pubrow,.pl,.band,.hand,.step,.fold,.hc{background:linear-gradient(90deg,var(--card1),var(--card2));border:1px solid var(--line);border-radius:12px}
.panel{padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 180px;min-width:0}
.btn{appearance:none;border:1px solid transparent;background:var(--acc);color:#fff;font-weight:500;font-size:15px;padding:11px 20px;border-radius:6px;cursor:pointer}
.btn:hover{background:var(--acc2)}
.btn.ghost{background:linear-gradient(90deg,var(--card1),var(--card2));border-color:var(--line);color:var(--fg)}
.btn.ghost:hover{border-color:var(--line2);background:#222}
.btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input[type=text]{background:#141414;border:1px solid var(--line);border-radius:6px;padding:11px 14px;width:100%;min-width:0}
input[type=text]::placeholder{color:var(--dim)}
input[type=checkbox]{accent-color:var(--acc)}
.err{color:#ff7a5c;min-height:1.4em;font-size:14px}
.note{color:var(--mute);font-size:14px}
/* hero */
.hero{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:22px;padding:72px 0 40px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));z-index:-1;
  background:radial-gradient(ellipse 60% 55% at 50% 30%,rgba(255,53,0,.16),transparent 70%),radial-gradient(ellipse 80% 70% at 50% 40%,#262626 0%,#101010 70%);
  -webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.hero h1{font-size:clamp(44px,8vw,80px);line-height:1.02}
.hero h1 em{font-style:normal;color:var(--acc)}
.hero .lead{font-size:17px;color:#d6d6d6;max-width:68ch}
.hero .panel{width:100%;max-width:560px;text-align:left}
.sech{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.sech h2{font-size:clamp(30px,5vw,44px)}
.sech .pill{justify-self:auto}
.sech p{color:#cfcfcf;max-width:70ch}
h2{font-size:26px}
.sec{display:flex;flex-direction:column;gap:16px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mode{padding:18px;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0}
.mode h3{font-size:19px}
.mode p{font-size:14px;color:#cfcfcf}
.mode .meta{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.pick .mode{cursor:pointer;color:var(--fg)}
.pick .mode:hover{border-color:var(--line2)}
.pick .mode.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;counter-reset:s}
.step{padding:20px;counter-increment:s;display:flex;flex-direction:column;gap:10px;min-height:190px}
.step::before{content:counter(s,decimal-leading-zero);font:600 26px var(--f-disp);color:var(--dim);margin-bottom:auto}
.step b{font:600 22px/1.15 var(--f-disp);display:block}
.step p{font-size:14px;color:#cfcfcf}
.stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stat{padding:8px 14px;font-size:14px;color:var(--mute)}
.stat b{color:var(--fg);font-weight:600}
.pubrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px}
.code{font:700 clamp(40px,10vw,64px)/1 var(--f-disp);letter-spacing:.16em;color:var(--fg)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.pl{padding:10px 14px;display:flex;justify-content:space-between;gap:8px;align-items:center;min-width:0}
.pl span{overflow-wrap:anywhere}
.tag{font:500 11px var(--f-body);border-radius:4px;padding:2px 7px;white-space:nowrap;background:#262626;color:var(--mute)}
.tag.a{background:var(--acc);color:#fff} .tag.r{background:rgba(255,77,77,.16);color:#ff6b6b} .tag.g{background:rgba(62,207,110,.14);color:#4fdc7c} .tag.m{background:#262626;color:var(--mute)}
.band{display:flex;gap:10px 26px;flex-wrap:wrap;align-items:center;padding:14px 18px}
.band .ph{font:600 22px var(--f-disp);color:var(--acc)}
.band .it{display:flex;flex-direction:column;gap:2px}
.band .it b{font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
#tm.over{color:#ff6b6b}
.scen{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.scen .panel h3{font-size:20px}
.scen ul{margin:0;padding-left:18px;color:#cfcfcf;font-size:14px}
.warnbox{border:1px solid rgba(255,53,0,.5);border-radius:12px;padding:14px 18px;background:rgba(255,53,0,.08);display:flex;flex-direction:column;gap:4px}
.warnbox .lab{color:var(--acc)}
.warnbox.red{border-color:rgba(255,77,77,.55);background:rgba(255,77,77,.08)}
/* карточки игроков */
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.fold{position:relative;display:flex;flex-direction:column;min-width:0;padding-bottom:8px;overflow:hidden}
.fold.me{border-color:var(--acc)}
.fold.out{opacity:.55}
.fold header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
.fold header b{font:600 17px var(--f-disp);overflow-wrap:anywhere}
.cell{padding:6px 14px;display:flex;flex-direction:column;gap:1px;min-width:0}
.lb{font:500 12px var(--f-body);display:flex;align-items:center;gap:6px}
.lb::before{content:"";width:7px;height:7px;border-radius:2px;background:currentColor;flex:none}
[data-k=prof] .lb{color:var(--c-prof)}[data-k=bio] .lb{color:var(--c-bio)}[data-k=health] .lb{color:var(--c-health)}[data-k=hobby] .lb{color:var(--c-hobby)}[data-k=bag] .lb{color:var(--c-bag)}[data-k=fact] .lb{color:var(--c-fact)}[data-k=trait] .lb{color:var(--c-trait)}[data-k=secret] .lb{color:var(--c-secret)}[data-k=spec] .lb{color:var(--c-spec)}
.cell .tx{font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.cell.shut .tx{color:transparent;background:#262626;height:10px;margin-top:5px;border-radius:3px;width:70%;user-select:none}
.cell.late .tx{color:#bdbdbd}
.stamp{position:absolute;right:12px;top:52px;transform:rotate(-10deg);border:2px solid #ff4d4d;color:#ff4d4d;font:700 18px var(--f-disp);padding:0 8px;border-radius:4px;letter-spacing:.06em;pointer-events:none}
.votes{font-size:12px;color:var(--mute);padding:6px 14px 0}
/* свои карты */
.hand{padding:20px;display:flex;flex-direction:column;gap:14px;border-color:rgba(255,53,0,.45)}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.hc{background:#151515;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.hc.done{opacity:.5}
.hc .tx{font-size:15px;line-height:1.35;overflow-wrap:anywhere;font-weight:500}
.hc .btn{align-self:flex-start}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;background:#1a1a1a;border:1px solid var(--line);border-radius:99px;padding:5px 13px;cursor:pointer;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.vote{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.vote .btn{text-align:left}
.vote .btn.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bar{height:6px;background:#262626;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.verdict h2{font-size:clamp(28px,6vw,44px)}
.verdict p{max-width:72ch;color:#e3e3e3}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#232323;border:1px solid var(--line2);color:#fff;padding:10px 16px;border-radius:8px;max-width:90vw;z-index:50;font-size:14px}
.gate{min-height:80vh;display:flex;align-items:center;justify-content:center}
.gate .panel{max-width:520px;text-align:center;align-items:center;padding:32px}
.gate h1{font:400 clamp(64px,18vw,120px)/1 var(--f-logo);color:var(--acc)}
.reveal{border-color:rgba(255,53,0,.35)}
.rvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.rv{background:#151515;border:1px solid var(--line);border-radius:10px;padding:10px 0 6px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rv.now{border-color:var(--acc)}
.rvh{padding:0 14px 6px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.rvh b{font:600 16px var(--f-disp);overflow-wrap:anywhere}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.vrow{display:flex;gap:8px;align-items:center;background:#151515;border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:0}
.vrow span,.vrow b{overflow-wrap:anywhere}
.vrow .arr{color:var(--acc);font-weight:600}
footer{color:var(--mute);font-size:13px;display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line);text-align:center}
@media(max-width:600px){.top{grid-template-columns:1fr auto}.top>.pill{display:none}.brand{font-size:22px;text-align:left}}
@media(prefers-reduced-motion:no-preference){.btn,.chip,.mode{transition:background .15s,border-color .15s}}
</style>

<div id="app"></div>

<script>

const pick=(a,r=Math.random)=>a[Math.floor(r()*a.length)];
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=hash(String(seed));return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function card(s,g){const i=s.lastIndexOf("|");const t=s.slice(0,i).replace(/\{([^|}]*)\|([^}]*)\}/g,(m,a,b)=>g==="ж"?b:a);return{t,s:+s.slice(i+1)}}
const yw=n=>(n%10===1&&n%100!==11)?"год":([2,3,4].includes(n%10)&&![12,13,14].includes(n%100))?"года":"лет";

function genHand(modeId){
  const m=MODE(modeId);const male=Math.random()<.5,g=male?"м":"ж";
  const age=18+Math.floor(Math.pow(Math.random(),1.25)*58);
  const build=pick([["худощавый","худощавая"],["крепкий","крепкая"],["полный","полная"],["атлетичный","атлетичная"],["низкорослый","низкорослая"],["очень высокий","очень высокая"]])[male?0:1];
  const fertile=Math.random()>.2&&!(!male&&age>50);
  const bt=(male?"Мужчина":"Женщина")+", "+age+" "+yw(age)+", "+build+(fertile?(m.eden?", способен"+(male?"":"на")+" к деторождению":""):", бесплодн"+(male?"ый":"ая"));
  const cards={bio:{t:bt,s:age<=35?2:age<=50?1:age<=65?0:-2,f:fertile,g:g}};
  ["prof","health","hobby","bag","fact","trait","spec"].forEach(k=>cards[k]=card(pick(POOL[k]),g));
  const sec=m.dirty?POOL.secret.concat(POOL.dirty,POOL.dirty):POOL.secret;
  cards.secret=card(pick(sec),g);
  return{cards};
}
function genBunker(){
  const feats=[];while(feats.length<3){const f=pick(BUN_FEAT);if(!feats.includes(f))feats.push(f)}
  return{size:card(pick(BUN_SIZE),"м"),sup:card(pick(BUN_SUP),"м"),feats:feats.map(f=>card(f,"м")),flaw:card(pick(BUN_FLAW),"м")};
}

function serverDb(){
  return new Promise((resolve,reject)=>{
    let token;try{token=localStorage.getItem("b18tok")}catch(e){}
    if(!token){token=(crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36))+"x";try{localStorage.setItem("b18tok",token)}catch(e){}}
    let cid=null,uid=null,first=true,n=0;const subs={};
    const call=(op,o)=>fetch("api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({op,cid,token},o))})
      .then(r=>r.json()).then(r=>{if(!r.ok)throw{code:r.err,message:r.err};return r.data});
    const mk=d=>({id:d.id,exists:d.exists,data:()=>d.data||undefined,metadata:{fromCache:false,hasPendingWrites:false}});
    function sub(spec,cb,err){const sid="s"+(++n);subs[sid]={spec,cb};if(cid)call("sub",{sid,spec}).catch(e=>err&&err(e));
      return()=>{delete subs[sid];if(cid)call("unsub",{sid}).catch(()=>{})}}
    const es=new EventSource("events?token="+encodeURIComponent(token));
    const timer=setTimeout(()=>{if(first){first=false;es.close();reject(new Error("no server"))}},6000);
    es.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
      if(m.t==="welcome"){cid=m.cid;uid=m.uid;for(const sid in subs)call("sub",{sid,spec:subs[sid].spec}).catch(()=>{});
        if(first){first=false;clearTimeout(timer);resolve(api)}}
      else if(m.t==="snap"&&subs[m.sid]){const s=subs[m.sid];s.cb(m.docs?{docs:m.docs.map(mk),size:m.docs.length,empty:!m.docs.length}:mk(m.doc))}};
    es.onerror=()=>{if(first){first=false;clearTimeout(timer);es.close();reject(new Error("no server"))}};
    const doc=path=>({path,id:path.split("/").pop(),
      get:()=>call("get",{path}).then(mk),set:data=>call("set",{path,data}),update:data=>call("update",{path,data}),delete:()=>call("del",{path}),
      onSnapshot:(cb,err)=>sub({k:"doc",path},cb,err)});
    const col=(path,f)=>({path,doc:id=>doc(path+"/"+id),
      where:(a,op,v)=>col(path,Object.assign({},f,{where:[a,op,v]})),limit:l=>col(path,Object.assign({},f,{limit:l})),
      onSnapshot:(cb,err)=>sub(Object.assign({k:"col",path},f),cb,err)});
    const api={uid:()=>uid,doc,collection:p=>col(p,{})};
  });
}

function eventFor(m,round){
  if(m.events)return pick(EVENTS);
  if(m.dirty&&round>=2)return "В этом раунде каждый обязан открыть карту «Секрет 18+», если она ещё закрыта.";
  return null;
}
function startGameFixed(){
  const c=pick(CATA).split("|");
  const ps=plist();if(ps.length<3){toast("Нужно минимум 3 игрока.");return}
  const m=MODE(ROOM.mode),n=ps.length,seats=Math.ceil(n/2),k=n-seats;
  const R=Math.max(1,Math.min(k,m.rounds)),base=Math.floor(k/R),extra=k%R,plan=[];
  for(let i=0;i<R;i++)plan.push(base+(i<extra?1:0));
  if(NET.kind==="local")ps.forEach(p=>{HANDS[p.id]=genHand(ROOM.mode);});
  wRoom({phase:"open",round:1,rounds:R,plan,seats,eliminated:[],seed:Math.random().toString(36).slice(2,10),
    cata:{t:c[0],d:c[1],h:+c[2]},bunker:genBunker(),event:eventFor(m,1),turnOrder:ps.map(p=>p.id),turn:0,deadline:Date.now()+TURN(m)*1000,lastOut:[],tally:{},penalty:null});
}

function tally(){
  const key=ROOM.round+":"+ROOM.phase;if(TALLYKEY===key)return;TALLYKEY=key;
  const al=alive().map(p=>p.id),cnt={};al.forEach(id=>cnt[id]=0);
  plist().forEach(p=>{if(al.includes(p.id)&&p.voteRound===ROOM.round&&p.vote&&cnt[p.vote]!==undefined)cnt[p.vote]++});
  const kick=(ROOM.plan||[])[ROOM.round-1]||1;
  const out=al.map(id=>({id,c:cnt[id],r:Math.random()})).sort((a,b)=>b.c-a.c||a.r-b.r).slice(0,Math.min(kick,al.length-1)).map(o=>o.id);
  const m=MODE(ROOM.mode);
  if(NET.kind==="local")out.forEach(id=>{PLAYERS[id].full=HANDS[id].cards});
  wRoom({phase:"result",eliminated:(ROOM.eliminated||[]).concat(out),lastOut:out,tally:cnt,penalty:m.drink?pick(PENALTY):null,deadline:null});
}
function nextRound(){
  const m=MODE(ROOM.mode);
  if(ROOM.round>=ROOM.rounds||alive().length<=ROOM.seats){
    if(NET.kind==="local")alive().forEach(p=>{PLAYERS[p.id].full=HANDS[p.id].cards});
    wRoom({phase:"final",deadline:null});return;
  }
  const r=ROOM.round+1;
  const al=alive().map(p=>p.id),sh=(r-1)%al.length,ord=al.slice(sh).concat(al.slice(0,sh));
  wRoom({phase:"open",round:r,event:eventFor(m,r),turnOrder:ord,turn:0,deadline:Date.now()+TURN(m)*1000,lastOut:[],tally:{},penalty:null});
}
function curTurn(){return ROOM&&ROOM.turnOrder?ROOM.turnOrder[ROOM.turn||0]:null}
function myTurnOk(id){
  if(!PLAYERS[id]||isOut(id))return false;
  if(ROOM.phase==="discuss")return true;
  return ROOM.phase==="open"&&curTurn()===id&&PLAYERS[id].openedRound!==ROOM.round;
}
function reveal(cat){
  const id=myId(),h=myHand();if(!h||!myTurnOk(id))return;
  const c=h.cards[cat];if(!c||(PLAYERS[id].revealed||{})[cat])return;
  const wasOpen=ROOM.phase==="open";
  wPlayer(id,{revealed:{[cat]:c.t},revealedAt:{[cat]:ROOM.round},openedRound:ROOM.round});
  if(NET.kind==="local"&&wasOpen)advanceTurn();
}
function advanceTurn(){
  const ord=ROOM.turnOrder||[];let t=(ROOM.turn||0)+1;
  while(t<ord.length&&(isOut(ord[t])||!PLAYERS[ord[t]]))t++;
  if(t>=ord.length){toDiscuss();return}
  wRoom({turn:t,deadline:Date.now()+TURN(MODE(ROOM.mode))*1000});
}
function castVote(target){
  const id=myId();if(ROOM.phase!=="vote"||isOut(id)||isOut(target)||id===target)return;
  wPlayer(id,{vote:target,voteRound:ROOM.round});
}

/* ───────── побочные эффекты после обновления данных ───────── */
function effects(){
  if(!ROOM||NET.kind!=="online")return;
  const me=K.uid;
  // руку создаёт сам игрок после старта (она приватная)
  if(ROOM.phase!=="lobby"&&HAND_LOADED&&!HAND&&!HANDBUSY&&PLAYERS[me]){
    HANDBUSY=true;
    const h=genHand(ROOM.mode);
    qw("hand",()=>K.db.doc("data/users/"+me+"/hand_"+NET.code).set(h)).then(()=>{HANDBUSY=false});
  }
  // изгнанные и выжившие в финале открывают всё
  if(HAND&&PLAYERS[me]&&!PLAYERS[me].full&&!SENTFULL&&(isOut(me)||ROOM.phase==="final")){
    SENTFULL=true;wPlayer(me,{full:HAND.cards});
  }
  if(isHost()){
    const n=Object.keys(PLAYERS).length;
    if(ROOM.phase==="lobby"&&ROOM.count!==n)wRoom({count:n});
    if(ROOM.phase==="open"&&ROOM.turnOrder){
      const cur=curTurn(),p=PLAYERS[cur];
      if(!p||isOut(cur)||p.openedRound===ROOM.round){const k=ROOM.round+":"+ROOM.turn;if(ADVKEY!==k){ADVKEY=k;advanceTurn()}}
    }
    if(ROOM.phase==="vote"){
      const al=alive();
      if(al.length&&al.every(p=>p.voteRound===ROOM.round&&p.vote))tally();
    }
  }
}

  const b=ROOM.bunker||{feats:[],flaw:{t:""},size:{t:""},sup:{t:""}};
  const res=ph==="result"?`<section class="panel"><h2>${out.length>1?"Покидают бункер":"Покидает бункер"}: ${out.map(p=>esc(p.nick)).join(", ")}</h2>
   <div class="sec">${ps.filter(p=>ROOM.tally&&ROOM.tally[p.id]!=null).sort((a,c)=>ROOM.tally[c.id]-ROOM.tally[a.id]).map(p=>{const mx=Math.max(1,...Object.values(ROOM.tally));return `<div><div class="row" style="justify-content:space-between"><span>${esc(p.nick)}</span><span class="mono">${ROOM.tally[p.id]}</span></div><div class="bar"><i style="width:${ROOM.tally[p.id]/mx*100}%"></i></div></div>`}).join("")}</div>
   ${ROOM.penalty?`<div class="warnbox"><span class="lab">Штраф раунда</span><p>${esc(ROOM.penalty)}</p></div>`:""}</section>`:"";
  return header(`<button class="btn ghost sm" data-a="leave">Выйти</button>`)+`<div class="wrap" style="padding-top:16px">
  <div class="band"><span class="ph">${PH[ph]}</span>
   <span class="it"><span class="lab">Раунд</span><b>${ROOM.round} / ${ROOM.rounds}</b></span>
   <span class="it"><span class="lab">Мест в бункере</span><b>${ROOM.seats}</b></span>
   <span class="it"><span class="lab">В игре</span><b>${al.length}</b></span>
   <span class="it"><span class="lab">Режим</span><b>${esc(m.name)}</b></span>
   ${ROOM.deadline&&["open","discuss","vote"].includes(ph)?`<span class="it"><span class="lab">Таймер</span><b id="tm"></b></span>`:""}</div>
  ${ROOM.event&&ph!=="result"?`<div class="warnbox"><span class="lab">Событие раунда</span><p>${esc(ROOM.event)}</p></div>`:""}
  ${controls()}
  ${roundRevealHtml()}
  ${ph==="vote"||ph==="result"?`<section class="panel"><h2>${ph==="vote"?"Кто за кого голосует":"Кто за кого проголосовал"}</h2>${votesHtml()}</section>`:""}
  ${res}
  <div class="scen"><section class="panel"><span class="lab">Катастрофа</span><h3>${esc((ROOM.cata||{}).t)}</h3><p class="note">${esc((ROOM.cata||{}).d||"")}</p></section>
   <section class="panel"><span class="lab">Бункер</span><h3>${esc(b.size.t)}, запасов ${esc(b.sup.t)}</h3><ul>${b.feats.map(f=>`<li>${esc(f.t)}</li>`).join("")}<li>Минус: ${esc(b.flaw.t)}</li></ul></section></div>
  ${handHtml()}
  ${ph==="vote"?votePanel():""}
  <section class="sec"><h2>Досье игроков</h2><div class="folders">${ps.map(dossier).join("")}</div></section></div>`;
}

/* ───────── финал ───────── */
function survivorData(){
  return alive().map(p=>{
    const src=p.full||(NET.kind==="local"&&HANDS[p.id]?HANDS[p.id].cards:null)||{};
    return{id:p.id,nick:p.nick,cards:src};
  });
}
function makeVerdict(){
  const m=MODE(ROOM.mode),r=rng(ROOM.seed||"x"),sv=survivorData(),n=Math.max(1,sv.length);
  let total=0,best=null,worst=null;
  sv.forEach(s=>{let t=0;for(const k in s.cards){const c=s.cards[k];if(c&&typeof c.s==="number")t+=c.s;
      if(k!=="bio"&&k!=="spec"&&c){if(!best||c.s>best.c.s)best={s,c,k};if(!worst||c.s<worst.c.s)worst={s,c,k}}}
    s.total=t;total+=t});
  const b=ROOM.bunker||{size:{s:0},sup:{s:0},feats:[],flaw:{s:0}};
  const bs=(b.size.s||0)+(b.sup.s||0)+b.feats.reduce((a,f)=>a+f.s,0)+(b.flaw.s||0);
  const hard=((ROOM.cata||{}).h||2);
  const val=total/n-(hard-2)*1.5+bs*.35;
  let title,body;
  if(val>=7){title="Золотой век под землёй";body="Бункер превратился в образцовое общество: еды хватает, энтузиазма больше, чем нужно, а споры решаются голосованием."}
  else if(val>=4){title="Выжили, местами со скрипом";body="Бункер держится. Кто-то храпит, кто-то воровал консервы, но в целом общество устояло."}
  else if(val>=1){title="Бункер трещит по швам";body="Выжившие дотянули до весны, но половина уже строит планы на побег, а вторая половина на заговор."}
  else{title="Это была ошибка";body="Состав подобрали так, что даже тараканы собрали вещи. Первая зима оказалась последней для идеи совместной жизни."}
  const parts=[`Катастрофа «${(ROOM.cata||{}).t}» осталась снаружи. ${body}`];
  if(best)parts.push(`Главная опора бункера: ${best.s.nick}. Козырь: «${best.c.t}» (${CATL[best.k].toLowerCase()}).`);
  if(worst&&worst!==best)parts.push(`Слабое звено: ${worst.s.nick}. Все помнят про «${worst.c.t}» (${CATL[worst.k].toLowerCase()}), и это сильно портит атмосферу.`);
  if(m.eden){
    const fm=sv.some(s=>s.cards.bio&&s.cards.bio.g==="м"&&s.cards.bio.f),ff=sv.some(s=>s.cards.bio&&s.cards.bio.g==="ж"&&s.cards.bio.f);
    parts.push(fm&&ff?"В бункере есть детородная пара, значит, человечество продолжится. Правда, в вопросе фамилий уже идёт спор.":"Детородной пары в бункере нет. Человечество вымрет, зато красиво и в хорошей компании.");
  }
  parts.push(pick(FLAVOR,r));
  let traitor=null;
  if(m.traitor){const tid=traitorId(),t=PLAYERS[tid];if(t){const win=!isOut(tid);traitor={nick:t.nick,win};parts.push(win?`Предатель ${t.nick} дожил до финала. Бункер проиграл.`:`Предателя ${t.nick} изгнали. Бункер выиграл.`)}}
  return{title,parts,sv,traitor};
}
function finalHtml(){
  const v=makeVerdict(),ps=plist();
  return header(`<button class="btn ghost sm" data-a="leave">Выйти</button>`)+`<div class="wrap" style="padding-top:20px">
  <section class="panel verdict"><span class="lab">Финал · ${esc(MODE(ROOM.mode).name)}</span><h2>${esc(v.title)}</h2>${v.parts.map(t=>`<p>${esc(t)}</p>`).join("")}
  ${K.sample?`<div class="row"><button class="btn ghost sm" data-a="ai" id="aibtn">Финал от Claude</button><span class="note">Свой вариант финала по картам выживших.</span></div><p id="ai"></p>`:""}</section>
  <section class="sec"><h2>Выжившие</h2><div class="folders">${ps.filter(p=>!isOut(p.id)).map(dossier).join("")}</div></section>
  <section class="sec"><h2>Изгнанные</h2><div class="folders">${ps.filter(p=>isOut(p.id)).map(dossier).join("")||`<p class="note">Никого.</p>`}</div></section>
  ${NET.kind==="local"?`<div class="row"><button class="btn" data-a="again">Новая партия с теми же игроками</button></div>`:""}</div>`;
}
async function aiFinal(){
  const el=$("#ai"),btn=$("#aibtn");if(!el||!K.sample)return;
  const v=makeVerdict(),c=ROOM.cata||{},b=ROOM.bunker;
  const txt=v.sv.map(s=>s.nick+": "+CATS.map(([k,l])=>s.cards[k]?l+" — "+s.cards[k].t:"").filter(Boolean).join("; ")).join("\n");
  const prompt="Ты ведущий взрослой игры «Бункер 18+». Напиши финал партии по-русски, 6-8 предложений, с чёрным юмором и лёгкой пошлостью, без откровенных сцен. Катастрофа: "+c.t+" — "+c.d+". Бункер: "+b.size.t+", запасы "+b.sup.t+", есть: "+b.feats.map(f=>f.t).join(", ")+", минус: "+b.flaw.t+". Выжившие и их карты:\n"+txt+"\nУпомяни каждого выжившего по имени и расскажи, чем кончилась их жизнь в бункере.";
  btn.disabled=true;el.textContent="Claude пишет финал…";
  try{const r=await K.sample(prompt,{onText:x=>{el.textContent=x.text},cache:false});el.textContent=r.text}
  catch(e){el.textContent="Не получилось: "+((e&&e.message)||"отказ")}
  btn.disabled=false;
}

/* ───────── клики ───────── */
const ACT={
  adult(){ADULT=true;try{sessionStorage.setItem(KEY,"1")}catch(e){}route()},
  notadult(){setErr("Тогда эта страница не для вас.")},
  create:createRoom,
  join(){joinRoom()},
  joinCode(v){const n=$("#nick");if(n&&!n.value.trim()){setErr("Сначала введите позывной.");return}joinRoom(v)},
  local:startLocal,
  leave(){leave()},
  copy(v){try{navigator.clipboard.writeText(v).then(()=>toast("Код скопирован"),()=>toast("Код: "+v))}catch(e){toast("Код: "+v)}},
  mode(v){wRoom({mode:v})},
  start:startGameFixed,
  reveal,
  vote:castVote,
  toDiscuss,toVote,tally,next:nextRound,skip(){if(ROOM.phase==="open")advanceTurn()},
  view(v){VIEW=v;SHOW=false;route()},
  toggleHand(){SHOW=!SHOW;route()},
  addLocal(){
    const i=$("#lname");const n=(i&&i.value||"").trim().slice(0,16);if(!n)return;
    if(Object.keys(PLAYERS).length>=16){toast("Максимум 16 игроков.");return}
    const id="p"+(Date.now()%1e6)+Math.floor(Math.random()*99);
    PLAYERS[id]=newPlayer(n);PLAYERS[id].joined=Date.now()+Object.keys(PLAYERS).length;route();
  },
  rm(v){delete PLAYERS[v];route()},
  again(){
    const keep=plist();PLAYERS={};keep.forEach(p=>{PLAYERS[p.id]=newPlayer(p.nick);PLAYERS[p.id].joined=p.joined});
    HANDS={};VIEW=null;SHOW=false;TALLYKEY="";LTURN="";ADVKEY="";
    ROOM=Object.assign(ROOM,{phase:"lobby",round:0,eliminated:[],lastOut:[],tally:{},penalty:null,event:null});route();
  },
  ai:aiFinal
};
app.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const f=ACT[b.dataset.a];if(f)f(b.dataset.v,b)});
app.addEventListener("keydown",e=>{
  if(e.key!=="Enter")return;
  if(e.target.id==="lname")ACT.addLocal();
  if(e.target.id==="code")ACT.join();
});

/* ───────── таймер ───────── */
setInterval(()=>{
  if(!ROOM||!ROOM.deadline)return;
  const left=Math.ceil((ROOM.deadline-Date.now())/1000),el=$("#tm");
  if(el){el.textContent=left>0?mmss(left):"время вышло";el.classList.toggle("over",left<=0)}
  if(NET.kind==="online"&&isHost()&&left<-1&&["open","discuss","vote"].includes(ROOM.phase)){
    const key=ROOM.round+":"+ROOM.phase+":"+(ROOM.turn||0);
    if(AUTOKEY!==key){AUTOKEY=key;if(ROOM.phase==="open"){ADVKEY=ROOM.round+":"+ROOM.turn;advanceTurn()}else if(ROOM.phase==="discuss")toVote();else tally()}
  }
},500);

route();
initCaps();
</script>
